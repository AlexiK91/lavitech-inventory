<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>מלאי LaviTech</title>
<meta name="theme-color" content="#15263a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="מלאי LaviTech">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  html, body { margin:0; height:100%; background:#15263a; overflow:hidden; }
  body { font:15px/1.4 system-ui, -apple-system, "Segoe UI", Arial, sans-serif; color:#fff; }
  iframe { position:fixed; inset:0; width:100%; height:100%; border:0; background:#eef1f4; }
  .splash { position:fixed; inset:0; z-index:2; background:#15263a; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px; transition:opacity .25s; }
  .splash.gone { opacity:0; pointer-events:none; }
  .splash img { width:96px; height:96px; }
  .splash h1 { margin:0; font-size:20px; font-weight:600; }
  .splash p { margin:0; color:#8fa3b8; font-size:14px; }
  .help { display:none; flex-direction:column; align-items:center; gap:10px; margin-top:12px; text-align:center; padding:0 24px; }
  .help.show { display:flex; }
  .help a, .help button { color:#15263a; background:#f2c94c; border:0; border-radius:12px; padding:11px 18px; font:inherit; font-weight:600; text-decoration:none; cursor:pointer; }
  .help small { color:#8fa3b8; max-width:320px; }
  .offline { position:fixed; inset:auto 12px calc(12px + env(safe-area-inset-bottom, 0px)) 12px; z-index:3; background:#d04545; color:#fff; border-radius:12px; padding:10px 14px; text-align:center; display:none; }
  .offline.show { display:block; }
</style>
</head>
<body>
<div class="splash" id="splash">
  <img src="icon-192.png" alt="">
  <h1>מלאי LaviTech</h1>
  <p>טוען…</p>
  <div class="help" id="help">
    <small>האפליקציה לא נטענת? בדרך כלל זה קורה כשמחוברים לכמה חשבונות Google, או בכניסה הראשונה לפני אישור הגישה.</small>
    <a id="openDirect" target="_blank" rel="noopener">פתיחה בדפדפן</a>
    <button id="hideSplash" type="button">להציג בכל זאת</button>
  </div>
</div>
<iframe id="app" title="מלאי LaviTech" allow="clipboard-write; camera"></iframe>
<div class="offline" id="offline">אין חיבור לאינטרנט – המלאי יתעדכן כשהחיבור יחזור</div>

<script>
  // The inventory app itself runs on Google Apps Script; this page only makes it installable.
  var APP_URL = 'https://script.google.com/macros/s/AKfycbzqmrtC4I6-l3F5BRBeogOM50l54CeeKd_GMnl0ucp1blziLampMaFsH5MUNLjvJ1o6/exec';
  // iPhone/iPad block Google's sign-in cookies inside an embedded frame (error 401),
  // so on Apple devices open the app directly instead of embedding it.
  var isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  if (isIOS) { location.replace(APP_URL); }
  var frame = document.getElementById('app');
  var splash = document.getElementById('splash');
  var hide = function () { splash.classList.add('gone'); };
  document.getElementById('openDirect').href = APP_URL;
  document.getElementById('hideSplash').onclick = hide;
  frame.addEventListener('load', function () { setTimeout(hide, 400); });
  frame.src = APP_URL;
  // If loading takes long, offer a way out (sign-in and first-time approval happen outside the app)
  setTimeout(function () { if (!splash.classList.contains('gone')) document.getElementById('help').classList.add('show'); }, 9000);

  var off = document.getElementById('offline');
  var net = function () { off.classList.toggle('show', !navigator.onLine); };
  window.addEventListener('online', net); window.addEventListener('offline', net); net();

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
</script>
</body>
</html>
